<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 | Part 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .basic-form-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .basic-form-container div {
            margin-bottom: 15px;
        }
        .basic-form-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assigment 4</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Part 1: Basic HTML</a></li>
                    <li class="nav-item"><a class="nav-link" href="bootstrap-form.html">Part 2: Bootstrap Form</a></li>
                    <li class="nav-item"><a class="nav-link" href="registration.html">Part 3: Registration</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <h2 class="text-center mb-4">Part 1: Basic HTML Forms & Validation</h2>
        
        <div class="basic-form-container">
            <form action="#" method="GET">
                
                <div>
                    <label for="userName">Name:</label>
                    <input type="text" id="userName" name="userName" required maxlength="50">
                </div>

                <div>
                    <label for="userEmail">Email:</label>
                    <input type="email" id="userEmail" name="userEmail" required>
                </div>

                <div>
                    <label for="userMessage">Message:</label>
                    <textarea id="userMessage" name="userMessage" rows="5" required minlength="10"></textarea>
                </div>

                <button type="submit">Submit Form</button>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
